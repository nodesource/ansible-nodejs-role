---
- name: Ensure selected Node.js version is valid
  ansible.builtin.assert:
    that:
      - nodejs_version in nodejs_supported_versions
    fail_msg: "Invalid Node.js version: {{ nodejs_version }}. Supported versions: {{ nodejs_supported_versions | join(', ') }}."

- name: Ensure required packages are installed
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ensure /usr/share/keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Uninstall existing Node.js and clean dependencies
  ansible.builtin.apt:
    name: nodejs
    state: absent
    autoremove: yes
  register: node_uninstall
  changed_when: node_uninstall.changed

- name: Remove old NodeSource files (if exist)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/nodesource.gpg
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/preferences.d/nodejs

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg
    mode: "0644"

- name: Convert GPG key to binary format and store in keyrings
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg
    creates: /usr/share/keyrings/nodesource.gpg
  become: yes

- name: Set correct permissions for the GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/nodesource.gpg
    mode: "0644"

- name: Detect system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: system_arch
  changed_when: false

- name: Ensure architecture is supported
  ansible.builtin.assert:
    that:
      - system_arch.stdout in ['amd64', 'arm64', 'armhf']
    fail_msg: "Unsupported architecture: {{ system_arch.stdout }}. Only amd64, arm64, and armhf are supported."

- name: Add NodeSource APT repository
  ansible.builtin.template:
    src: nodesource.list.j2
    dest: /etc/apt/sources.list.d/nodesource.list
    mode: "0644"

- name: Add package pinning for Node.js
  ansible.builtin.template:
    src: preferences.d/nodejs.j2
    dest: /etc/apt/preferences.d/nodejs
    mode: "0644"

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Node.js
  ansible.builtin.apt:
    pkg: nodejs
    state: present

- name: Verify Node.js installation
  ansible.builtin.command:
    cmd: node -v
  register: node_version_output
  changed_when: false

- name: Validate installed Node.js version
  ansible.builtin.assert:
    that:
      - "node_version_output.stdout is search(nodejs_version | regex_replace('x', ''))"
    success_msg: "Node.js is correctly installed with version {{ node_version_output.stdout }}"
    fail_msg: "Expected Node.js {{ nodejs_version }}, but found {{ node_version_output.stdout }}"
